  - name: publications
  # - name: Talks
  # - name: Research
  # - name: Software
  - name: teaching
  - name: courses
  - name: CV

include:
  - .htaccess
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links


plugins: ['jekyll/scholar']

scholar:

  last_name: Rajkumar
  first_name: [Prajit, P.]

  style: citesty
  locale: en

  source: /_bibliography/
  bibliography: articles.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  bibliography_list_tag: ul
  # bibliography_item_tag: il

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  bibtex_skip_fields: [abstract, month_numeric, file, link, status, slides, poster, poster_pres, invited, selected, addit, winds, tides, preprint, published]

  query: "@*"

  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_boostrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
